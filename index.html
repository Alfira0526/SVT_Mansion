<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>세븐틴 아파트 배치</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f5f5f5;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .wrapper {
      max-width: 960px;
      width: 100%;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .desc {
      font-size: 14px;
      margin-bottom: 20px;
      color: #bbbbbb;
    }

    .building {
      border-radius: 16px;
      padding: 16px;
      background: #1b1b1b;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
    }

    .floor-label {
      font-size: 14px;
      margin: 10px 0 4px;
      color: #aaaaaa;
      font-weight: 600;
    }

    .floor {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .unit {
      background: #222;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .unit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #cfcfcf;
    }

    .unit-header span.unit-name {
      font-weight: 600;
    }

    select.resident-select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: #f5f5f5;
      font-size: 13px;
    }

    select.resident-select:focus {
      outline: none;
      border-color: #888;
    }

    .resident-view {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      min-height: 48px;
    }
