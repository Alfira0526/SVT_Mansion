<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>세븐틴 아파트 배치</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f5f5f5;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .wrapper {
      max-width: 960px;
      width: 100%;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .desc {
      font-size: 14px;
      margin-bottom: 20px;
      color: #bbbbbb;
    }

    .building {
      border-radius: 16px;
      padding: 16px;
      background: #1b1b1b;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
    }

    .floor-label {
      font-size: 14px;
      margin: 10px 0 4px;
      color: #aaaaaa;
      font-weight: 600;
    }

    .floor {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .unit {
      background: #222;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .unit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #cfcfcf;
    }

    .unit-header span.unit-name {
      font-weight: 600;
    }

    select.resident-select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: #f5f5f5;
      font-size: 13px;
    }

    select.resident-select:focus {
      outline: none;
      border-color: #888;
    }

    .resident-view {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      min-height: 48px;
    }

    .resident-info {
      font-size: 13px;
      color: #dddddd;
    }

    .resident-image {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #333;
      object-fit: cover;
      flex-shrink: 0;
    }

    .placeholder {
      font-size: 12px;
      color: #777;
    }

    .summary-container {
      margin-top: 24px;
      padding: 16px;
      border-radius: 16px;
      background: #1b1b1b;
      border: 1px solid #333;
    }

    .summary-container h2 {
      font-size: 18px;
      margin: 0 0 10px;
    }

    .summary-table-wrapper table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .summary-table-wrapper th,
    .summary-table-wrapper td {
      border-bottom: 1px solid #333;
      padding: 6px 8px;
      text-align: left;
    }

    .summary-table-wrapper th {
      background: #222;
    }

    .summary-actions {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid #444;
      background: #222;
      color: #f5f5f5;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    .summary-note {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
    }

    @media (max-width: 700px) {
      .floor {
        grid-template-columns: repeat(1, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>세븐틴 아파트 배치</h1>
    <p class="desc">
      각 집을 클릭해서 입주자를 선택하면, 아래에 현재 배치 통계가 자동으로 계산됩니다.<br/>
      <strong>“Google 시트로 저장”</strong>을 누르면 결과가 바로 Google Sheet에 쌓여요.
    </p>

    <div id="building" class="building"></div>

    <div class="summary-container">
      <h2>현재 배치 통계 (이 페이지)</h2>
      <div id="summaryTable" class="summary-table-wrapper">
        <p class="placeholder">아직 아무도 배정되지 않았어요.</p>
      </div>

      <div class="summary-actions">
        <button id="sendToSheetBtn" type="button">Google 시트로 저장</button>
        <button id="downloadCsvBtn" type="button">CSV로 저장 (옵션)</button>
      </div>

      <p class="summary-note">
        ※ Google 시트에는 [응답시간, 브라우저정보, 층, 호수, 입주자] 순으로 데이터가 쌓입니다.
      </p>
    </div>
  </div>

  <!-- 숨겨진 폼: Apps Script Web App 으로 전송용 -->
  <form id="gsheetForm"
        method="POST"
        target="hidden_iframe"
        action="https://script.google.com/macros/s/AKfycbwjPvSyXBUFE0gJTFnajOl1ECAgwcnrH4WXxVng57yL7TzU7gzqmsRMGnKRN_0i3m9Y2w/exec"
        style="display:none;">
    <input type="hidden" name="dummy" value="1" />
    <textarea name="payload" id="payloadField"></textarea>
  </form>
  <iframe name="hidden_iframe" style="display:none;"></iframe>

  <script>
    const FLOORS = 5;

    const residents = [
      { id: "에스쿱스", label: "에스쿱스", img: "image/scoups.jpeg" },
      { id: "정한",     label: "정한",     img: "image/jeonghan.jpeg" },
      { id: "조슈아",   label: "조슈아",   img: "image/joshua.jpeg" },
      { id: "준",       label: "준",       img: "image/jun.jpeg" },
      { id: "호시",     label: "호시",     img: "image/hoshi.jpeg" },
      { id: "원우",     label: "원우",     img: "image/wonwoo.jpeg" },
      { id: "우지",     label: "우지",     img: "image/woozi.jpeg" },
      { id: "디에잇",   label: "디에잇",   img: "image/the8.jpeg" },
      { id: "민규",     label: "민규",     img: "image/mingyu.jpeg" },
      { id: "도겸",     label: "도겸",     img: "image/dk.jpeg" },
      { id: "승관",     label: "승관",     img: "image/seungkwan.jpeg" },
      { id: "버논",     label: "버논",     img: "image/vernon.jpeg" },
      { id: "디노",     label: "디노",     img: "image/dino.jpeg" },
      { id: "나",       label: "나",       img: "image/me.jpeg" },
      { id: "공실",     label: "공실",     img: "image/empty.jpeg" }
];


    const buildingEl = document.getElementById("building");

    function createUnit(floorNumber, unitNumber) {
      const unit = document.createElement("div");
      unit.className = "unit";
      unit.dataset.floor = String(floorNumber);
      unit.dataset.unit = String(unitNumber);

      const header = document.createElement("div");
      header.className = "unit-header";

      const unitName = document.createElement("span");
      unitName.className = "unit-name";
      unitName.textContent = `${floorNumber}층 ${unitNumber}호`;

      const headerSub = document.createElement("span");
      headerSub.textContent = "입주자 선택";

      header.appendChild(unitName);
      header.appendChild(headerSub);

      const select = document.createElement("select");
      select.className = "resident-select";

      const defaultOpt = document.createElement("option");
      defaultOpt.value = "";
      defaultOpt.textContent = "— 선택 —";
      select.appendChild(defaultOpt);

      residents.forEach((r) => {
        const opt = document.createElement("option");
        opt.value = r.id;
        opt.textContent = r.label;
        select.appendChild(opt);
      });

      const view = document.createElement("div");
      view.className = "resident-view";

      const img = document.createElement("img");
      img.className = "resident-image";
      img.alt = "";
      img.style.display = "none";

      const info = document.createElement("div");
      info.className = "resident-info placeholder";
      info.textContent = "아직 입주자를 선택하지 않았어요.";

      view.appendChild(img);
      view.appendChild(info);

      select.addEventListener("change", () => {
        const selectedId = select.value;
        if (!selectedId) {
          img.style.display = "none";
          info.textContent = "아직 입주자를 선택하지 않았어요.";
          info.classList.add("placeholder");
        } else {
          const found = residents.find((r) => r.id === selectedId);
          if (found) {
            img.src = found.img;
            img.alt = found.label;
            img.style.display = "block";
            info.textContent = found.label;
            info.classList.remove("placeholder");
          } else {
            img.style.display = "none";
            info.textContent = selectedId;
            info.classList.remove("placeholder");
          }
        }

        updateSummary();
      });

      unit.appendChild(header);
      unit.appendChild(select);
      unit.appendChild(view);

      return unit;
    }

    function createBuilding() {
      for (let f = FLOORS; f >= 1; f--) {
        const floorLabel = document.createElement("div");
        floorLabel.className = "floor-label";
        floorLabel.textContent = `${f}층`;

        const floor = document.createElement("div");
        floor.className = "floor";

        for (let u = 1; u <= 3; u++) {
          floor.appendChild(createUnit(f, u));
        }

        buildingEl.appendChild(floorLabel);
        buildingEl.appendChild(floor);
      }
    }

    function collectResults() {
      const units = document.querySelectorAll(".unit");
      const result = [];
      units.forEach((unit) => {
        const floor = Number(unit.dataset.floor);
        const unitNo = Number(unit.dataset.unit);
        const select = unit.querySelector("select.resident-select");
        result.push({
          floor,
          unit: unitNo,
          resident: select.value || ""
        });
      });
      return result;
    }

    function calcStats(results) {
      const counts = {};
      results.forEach((item) => {
        if (!item.resident) return;
        counts[item.resident] = (counts[item.resident] || 0) + 1;
      });
      return counts;
    }

    function updateSummary() {
      const summaryEl = document.getElementById("summaryTable");
      const results = collectResults();
      const stats = calcStats(results);

      const hasAny = results.some((r) => r.resident);

      if (!hasAny) {
        summaryEl.innerHTML = "<p class='placeholder'>아직 아무도 배정되지 않았어요.</p>";
        return;
      }

      let html = "<table><thead><tr><th>이름</th><th>배정된 집 수</th></tr></thead><tbody>";

      residents.forEach((r) => {
        const count = stats[r.id] || 0;
        if (count === 0) return;
        html += `<tr><td>${r.label}</td><td>${count}</td></tr>`;
      });

      html += "</tbody></table>";

      summaryEl.innerHTML = html;
    }

    function downloadCsv() {
      const results = collectResults();
      const header = ["floor", "unit", "resident"];
      const rows = [header.join(",")];

      results.forEach((r) => {
        const residentSafe = `"${(r.resident || "").replace(/"/g, '""')}"`;
        rows.push([r.floor, r.unit, residentSafe].join(","));
      });

      const csvContent = rows.join("\n");
      const blob = new Blob([csvContent], {
        type: "text/csv;charset=utf-8;"
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");

      a.href = url;
      a.download = `apartment-result-${timestamp}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function sendToSheet() {
      const results = collectResults();
      const hasAny = results.some((r) => r.resident);
      if (!hasAny) {
        alert("최소 한 집 이상은 입주자를 선택해주세요!");
        return;
      }

      const payload = {
        submittedAt: new Date().toISOString(),
        userAgent: navigator.userAgent || "",
        results
      };

      const form = document.getElementById("gsheetForm");
      const textarea = document.getElementById("payloadField");

      textarea.value = JSON.stringify(payload);
      form.submit();
      alert("Google 시트로 전송되었습니다!");
    }

    createBuilding();
    updateSummary();

    document.getElementById("downloadCsvBtn").addEventListener("click", downloadCsv);
    document.getElementById("sendToSheetBtn").addEventListener("click", sendToSheet);
  </script>
</body>
</html>
