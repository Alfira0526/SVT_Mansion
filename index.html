<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>세븐틴 아파트 배치</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f5f5f5;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .wrapper {
      max-width: 960px;
      width: 100%;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .desc {
      font-size: 14px;
      margin-bottom: 20px;
      color: #bbbbbb;
    }

    .building {
      border-radius: 16px;
      padding: 16px;
      background: #1b1b1b;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
      margin-bottom: 16px;
    }

    .floor-label {
      font-size: 14px;
      margin: 10px 0 4px;
      color: #aaaaaa;
      font-weight: 600;
    }

    .floor {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .unit {
      background: #222;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .unit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #cfcfcf;
    }

    .unit-header span.unit-name {
      font-weight: 600;
    }

    select.resident-select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: #f5f5f5;
      font-size: 13px;
    }

    select.resident-select:focus {
      outline: none;
      border-color: #888;
    }

    .resident-view {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      min-height: 48px;
    }

    .resident-info {
      font-size: 13px;
      color: #dddddd;
    }

    .resident-image {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #333;
      object-fit: cover;
      flex-shrink: 0;
    }

    .placeholder {
      font-size: 12px;
      color: #777;
    }

    .actions {
      margin: 12px 0 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid #444;
      background: #222;
      color: #f5f5f5;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    .preview-container {
      margin-top: 16px;
      padding: 16px;
      border-radius: 16px;
      background: #1b1b1b;
      border: 1px solid #333;
    }

    .preview-title {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .preview-floor {
      margin-bottom: 10px;
    }

    .preview-floor-label {
      font-size: 13px;
      color: #aaaaaa;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .preview-floor-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .preview-unit {
      background: #222;
      border-radius: 12px;
      padding: 8px;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-height: 80px;
    }

    .preview-unit-label {
      font-size: 12px;
      color: #bbbbbb;
    }

    .preview-unit img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
    }

    .preview-unit-name {
      font-size: 12px;
    }

    .preview-empty {
      font-size: 12px;
      color: #666;
    }

    @media (max-width: 700px) {
      .floor {
        grid-template-columns: repeat(1, minmax(0, 1fr));
      }
      .preview-floor-grid {
        grid-template-columns: repeat(1, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>세븐틴 아파트 배치</h1>
    <p class="desc">
      각 집에 입주자를 한 명씩 배치해 주세요. 같은 멤버는 한 번만 배치할 수 있고, 공실은 여러 곳에 둘 수 있습니다.
      배치를 마친 뒤 <strong>저장하기</strong>를 누르면, 아래에 맨션 배치 미리보기가 생성되고 결과가 Google 시트로 전송됩니다.
      이후 <strong>이미지로 저장하기</strong> 버튼을 눌러 미리보기를 PNG 이미지로 저장할 수 있습니다.
    </p>

    <div id="building" class="building"></div>

    <div class="actions">
      <button id="saveBtn" type="button">저장하기</button>
      <button id="downloadBtn" type="button" style="display:none;">이미지로 저장하기</button>
    </div>

    <div id="previewContainer" class="preview-container" style="display:none;">
      <div class="preview-title">배치 미리보기</div>
      <div id="previewContent"></div>
    </div>
  </div>

  <!-- 숨겨진 폼: Apps Script Web App 으로 전송용 -->
  <form id="gsheetForm"
        method="POST"
        target="hidden_iframe"
        action="https://script.google.com/macros/s/AKfycbwjPvSyXBUFE0gJTFnajOl1ECAgwcnrH4WXxVng57yL7TzU7gzqmsRMGnKRN_0i3m9Y2w/exec"
        style="display:none;">
    <textarea name="payload" id="payloadField"></textarea>
  </form>
  <iframe name="hidden_iframe" style="display:none;"></iframe>

  <!-- html2canvas CDN -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    const FLOORS = 5;

    const residents = [
      { id: "에스쿱스", label: "에스쿱스", img: "image/scoups.jpeg" },
      { id: "정한",     label: "정한",     img: "image/jeonghan.jpeg" },
      { id: "조슈아",   label: "조슈아",   img: "image/joshua.jpeg" },
      { id: "준",       label: "준",       img: "image/jun.jpeg" },
      { id: "호시",     label: "호시",     img: "image/hoshi.jpeg" },
      { id: "원우",     label: "원우",     img: "image/wonwoo.jpeg" },
      { id: "우지",     label: "우지",     img: "image/woozi.jpeg" },
      { id: "디에잇",   label: "디에잇",   img: "image/the8.jpeg" },
      { id: "민규",     label: "민규",     img: "image/mingyu.jpeg" },
      { id: "도겸",     label: "도겸",     img: "image/dk.jpeg" },
      { id: "승관",     label: "승관",     img: "image/seungkwan.jpeg" },
      { id: "버논",     label: "버논",     img: "image/vernon.jpeg" },
      { id: "디노",     label: "디노",     img: "image/dino.jpeg" },
      { id: "나",       label: "나",       img: "image/me.jpeg" },
      { id: "공실",     label: "공실",     img: "image/empty.jpeg" }
    ];

    const buildingEl = document.getElementById("building");
    const allSelects = [];
    const downloadBtn = document.getElementById("downloadBtn");

    // 이미 선택된 (공실 제외) 멤버 목록
    function getSelectedUniqueIds() {
      const ids = [];
      allSelects.forEach(select => {
        const v = select.value;
        if (v && v !== "공실") {
          ids.push(v);
        }
      });
      return ids;
    }

    // 모든 셀렉트에서 이미 선택된 멤버는 다른 셀렉트의 드롭다운 목록에 아예 안 보이게
    function updateAllSelectOptions() {
      const selected = getSelectedUniqueIds(); // 공실 제외, 현재 선택된 멤버들

      allSelects.forEach(select => {
        const currentValue = select.value; // 이 셀렉트가 지금 들고 있는 값

        // 옵션 전부 갈아엎기
        select.innerHTML = "";

        // 기본값
        const defaultOpt = document.createElement("option");
        defaultOpt.value = "";
        defaultOpt.textContent = "— 선택 —";
        select.appendChild(defaultOpt);

        residents.forEach(r => {
          // 공실은 언제나 중복 허용
          if (r.id === "공실") {
            const opt = document.createElement("option");
            opt.value = r.id;
            opt.textContent = r.label;
            select.appendChild(opt);
            return;
          }

          // 이미 다른 집에 배치된 멤버면 리스트에서 제거
          // 단, 이 셀렉트가 지금 그 멤버를 들고 있는 경우는 유지
          if (r.id !== currentValue && selected.includes(r.id)) {
            return;
          }

          const opt = document.createElement("option");
          opt.value = r.id;
          opt.textContent = r.label;
          select.appendChild(opt);
        });

        // 기존 선택 복원 (없으면 자동으로 기본값으로 감)
        select.value = currentValue;
      });
    }

    function createUnit(floorNumber, unitNumber) {
      const unit = document.createElement("div");
      unit.className = "unit";
      unit.dataset.floor = String(floorNumber);
      unit.dataset.unit = String(unitNumber);

      const header = document.createElement("div");
      header.className = "unit-header";

      const unitName = document.createElement("span");
      unitName.className = "unit-name";
      // 5층 1호 -> 501호 형식
      const roomNumber = `${floorNumber}${String(unitNumber).padStart(2, "0")}`;
      unitName.textContent = `${roomNumber}호`;

      const headerSub = document.createElement("span");
      headerSub.textContent = "입주자 선택";

      header.appendChild(unitName);
      header.appendChild(headerSub);

      const select = document.createElement("select");
      select.className = "resident-select";

      const defaultOpt = document.createElement("option");
      defaultOpt.value = "";
      defaultOpt.textContent = "— 선택 —";
      select.appendChild(defaultOpt);

      residents.forEach((r) => {
        const opt = document.createElement("option");
        opt.value = r.id;
        opt.textContent = r.label;
        select.appendChild(opt);
      });

      const view = document.createElement("div");
      view.className = "resident-view";

      const img = document.createElement("img");
      img.className = "resident-image";
      img.alt = "";
      img.style.display = "none";

      const info = document.createElement("div");
      info.className = "resident-info placeholder";
      info.textContent = "아직 입주자를 선택하지 않았어요.";

      view.appendChild(img);
      view.appendChild(info);

      allSelects.push(select);

      select.addEventListener("change", () => {
        const selectedId = select.value;
        if (!selectedId) {
          img.style.display = "none";
          info.textContent = "아직 입주자를 선택하지 않았어요.";
          info.classList.add("placeholder");
        } else {
          const found = residents.find((r) => r.id === selectedId);
          if (found) {
            img.src = found.img;
            img.alt = found.label;
            img.style.display = "block";
            info.textContent = found.label;
            info.classList.remove("placeholder");
          } else {
            img.style.display = "none";
            info.textContent = selectedId;
            info.classList.remove("placeholder");
          }
        }

        updateAllSelectOptions();
      });

      unit.appendChild(header);
      unit.appendChild(select);
      unit.appendChild(view);

      return unit;
    }

    function createBuilding() {
      for (let f = FLOORS; f >= 1; f--) {
        const floorLabel = document.createElement("div");
        floorLabel.className = "floor-label";
        floorLabel.textContent = `${f}층`;

        const floor = document.createElement("div");
        floor.className = "floor";

        for (let u = 1; u <= 3; u++) {
          floor.appendChild(createUnit(f, u));
        }

        buildingEl.appendChild(floorLabel);
        buildingEl.appendChild(floor);
      }

      updateAllSelectOptions();
    }

    function collectResults() {
      const units = document.querySelectorAll(".unit");
      const result = [];
      units.forEach((unit) => {
        const floor = Number(unit.dataset.floor);
        const unitNo = Number(unit.dataset.unit);
        const select = unit.querySelector("select.resident-select");
        result.push({
          floor,
          unit: unitNo,
          resident: select.value || ""
        });
      });
      return result;
    }

    // 미리보기 생성
    function renderPreview(results) {
      const container = document.getElementById("previewContainer");
      const content = document.getElementById("previewContent");
      const anySelected = results.some(r => r.resident);

      if (!anySelected) {
        container.style.display = "block";
        content.innerHTML = "<p class='preview-empty'>아직 배치된 멤버가 없습니다.</p>";
        downloadBtn.style.display = "none";
        return;
      }

      container.style.display = "block";
      content.innerHTML = "";

      for (let f = FLOORS; f >= 1; f--) {
        const floorBlock = document.createElement("div");
        floorBlock.className = "preview-floor";

        const floorLabel = document.createElement("div");
        floorLabel.className = "preview-floor-label";
        floorLabel.textContent = `${f}층`;

        const grid = document.createElement("div");
        grid.className = "preview-floor-grid";

        for (let u = 1; u <= 3; u++) {
          const unitDiv = document.createElement("div");
          unitDiv.className = "preview-unit";

          const roomNumber = `${f}${String(u).padStart(2, "0")}`;
          const label = document.createElement("div");
          label.className = "preview-unit-label";
          label.textContent = `${roomNumber}호`;
          unitDiv.appendChild(label);

          const found = results.find(r => r.floor === f && r.unit === u);

          if (found && found.resident) {
            const residentMeta = residents.find(r => r.id === found.resident);
            if (residentMeta) {
              const img = document.createElement("img");
              img.src = residentMeta.img;
              img.alt = residentMeta.label;
              unitDiv.appendChild(img);

              const name = document.createElement("div");
              name.className = "preview-unit-name";
              name.textContent = residentMeta.label;
              unitDiv.appendChild(name);
            } else {
              const name = document.createElement("div");
              name.className = "preview-unit-name preview-empty";
              name.textContent = found.resident;
              unitDiv.appendChild(name);
            }
          } else {
            const empty = document.createElement("div");
            empty.className = "preview-unit-name preview-empty";
            empty.textContent = "공실";
            unitDiv.appendChild(empty);
          }

          grid.appendChild(unitDiv);
        }

        floorBlock.appendChild(floorLabel);
        floorBlock.appendChild(grid);
        content.appendChild(floorBlock);
      }

      // 미리보기가 있을 때만 "이미지로 저장하기" 버튼 노출
      downloadBtn.style.display = "inline-block";
    }

    // 미리보기 영역을 PNG 이미지로 다운로드
    function downloadPreviewAsImage() {
      const container = document.getElementById("previewContainer");
      if (!container) return;

      html2canvas(container, { backgroundColor: null }).then(canvas => {
        const link = document.createElement("a");
        link.href = canvas.toDataURL("image/png");
        link.download = "SVT_Mansion.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }).catch(err => {
        console.error(err);
        alert("이미지 저장 중 오류가 발생했습니다. 브라우저를 바꿔보거나 새로고침 후 다시 시도해 주세요.");
      });
    }

    function sendToSheetAndPreview() {
      const results = collectResults();

      const hasAny = results.some((r) => r.resident);
      if (!hasAny) {
        alert("최소 한 집 이상은 입주자를 선택해주세요!");
        return;
      }

      // 중복 체크 (공실 제외)
      const selected = getSelectedUniqueIds();
      const unique = new Set(selected);
      if (selected.length !== unique.size) {
        alert("같은 멤버를 두 번 배치할 수 없습니다. 중복 배치를 수정해 주세요.");
        return;
      }

      // 미리보기 먼저 생성
      renderPreview(results);

      const payload = {
        submittedAt: new Date().toISOString(),
        userAgent: navigator.userAgent || "",
        results
      };

      const form = document.getElementById("gsheetForm");
      const textarea = document.getElementById("payloadField");

      textarea.value = JSON.stringify(payload);

      form.submit();
      alert("배치를 저장했고, Google 시트로 전송했습니다!");
    }

    createBuilding();

    document.getElementById("saveBtn").addEventListener("click", sendToSheetAndPreview);
    downloadBtn.addEventListener("click", downloadPreviewAsImage);
  </script>
</body>
</html>
